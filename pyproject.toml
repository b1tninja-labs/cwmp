[build-system]
# Declared explicitly rather than relying on pip's legacy setuptools fallback: with no
# build-system table pip injects an unpinned setuptools environment, so a build is
# neither reproducible nor hermetic.
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cwmp"
dynamic = ["version"]
# The description names the protocol and the documents, because that is the only text
# a person searching PyPI will read before deciding this is the library they need.
description = "CWMP remote management: SOAP 1.1 RPC codec, session machinery, Digest authentication, parameter path trees and file transfer, ACS and CPE sides"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Justin Capella" }]
keywords = ["tr-069", "cwmp", "acs", "cpe", "provisioning", "tr-181", "soap", "hntl"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
# Empty unless a module cannot be honest without it. Every entry needs a sentence in
# README.md explaining why the zero-dependency rule was broken for it.
#
# devicespy is the portfolio's one home for the hardened XML reader (`devicespy.xmlsafe.parse`):
# every SOAP envelope comes from a peer that is a stranger, and two copies of security-critical
# parsing is the defect the portfolio forbids. It is not on an index yet, so until it publishes
# it resolves from the sibling checkout in this workspace, as pkix resolves asn1core.
dependencies = ["devicespy"]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "hypothesis",
  "ruff",
  "mypy",
  # tools/check_dist.py cannot assert a wheel contains what the docs promise without
  # first being able to build one, so the build dependency belongs in the dev group.
  "build",
]

[project.urls]
Homepage = "https://github.com/b1tninja/cwmp"
Repository = "https://github.com/b1tninja/cwmp"
Issues = "https://github.com/b1tninja/cwmp/issues"
Changelog = "https://github.com/b1tninja/cwmp/blob/main/CHANGELOG.md"

[project.scripts]
cwmp = "cwmp.cli:main"


[tool.hatch.version]
path = "cwmp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["cwmp"]

[tool.hatch.build.targets.sdist]
include = ["/cwmp/", "/tests/", "/docs/", "/README.md", "/ROADMAP.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "../devicespy" resolves the XML reader from the sibling checkout until devicespy publishes.
pythonpath = [".", "../devicespy"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["cwmp"]

[tool.coverage.report]
# The shell floor, deliberately low and deliberately ratcheted: a stub only earns
# coverage for the line that raises. Raise this in the commit that implements a
# milestone, never in a commit that only adds tests, so the number keeps meaning
# "this behaviour is exercised" rather than "this file was imported".
fail_under = 45
show_missing = true
exclude_lines = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "pragma: no cover",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [".deps"]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "N", "UP", "SIM", "C4", "PT", "RUF", "S", "RET", "ARG"]
ignore = [
  "E501",  # line length is the formatter's job
]
# S101 is not ignored here: `python -O` strips an assert, so one in package code is a check that
# vanishes in exactly the build that ships without the test suite watching.

[tool.ruff.lint.per-file-ignores]
# S101 in tests is the policy, S311 is a seeded generator rather than a token, and a
# test double has to accept parameters it ignores, which ARG would otherwise flag.
"tests/*" = ["S101", "S106", "S311", "ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "../devicespy"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
